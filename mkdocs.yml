site_name: GoliathApp
site_description: General-purpose enterprise platform for access control, workflows, and distributed workers.
site_url: https://goliath-research.github.io/GoliathApp/
repo_url: https://github.com/Goliath-Research/GoliathApp
repo_name: Goliath-Research/GoliathApp
docs_dir: docs
strict: true

plugins:
  - search
  - mermaid2:
      # Mermaid 9 + non-custom superfence: plugin emits div.mermaid and initializes
      # (Mermaid 10 + fence_mermaid_custom leaves diagrams uninitialized in 1.2.3).
      version: 9.4.3
      arguments:
        theme: default
        securityLevel: loose
        startOnLoad: true

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy

nav:
  - Overview: index.md
  - Getting started:
      - Adopter guide: adopter-guide.md
      - Architecture: architecture.md
      - Feature catalog: feature-catalog.md
      - Database population: database-population.md
  - Platform: platform.md
  - Decoupling plan (Phase D): decoupling-plan.md
  - Repository layout: workspace-index.md
  - Workflow compiler: workflow-compiler.md
  - Workflow engine: workflow-engine.md
  - Actions: actions.md
  - Workers: workers.md
  - Device adapters: device-adapters.md
  - Dual worker activation: dual-activation.md
  - RBAC: rbac.md
  - Pipeline profiles: pipeline-profiles.md
  - Schema apply: schema-apply.md
  - Portal nav (Meta Tree): nav-tree-meta.md
  - Meta model (design): meta-model.md
  - Semantic layer: semantic-layer.md
  - Semantic extensions: semantic-extensions.md
  - Inventory module: inventory-module.md
  - Deployment: deployment.md

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid

validation:
  omitted_files: warn
  absolute_links: ignore
  unrecognized_links: warn
  anchors: warn
