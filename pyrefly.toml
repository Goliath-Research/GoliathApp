# Static type checking for GoliathApp. From the repository root:
#   python -m pip install -e "workflow_engine/[dev]"
#   pyrefly check

project-includes = [
  "workflow_engine",
  "goliath_app",
  "scripts",
  "goliath_worker",
  "workflow_engine/goliath_app",
]

# CI and local development run on 3.12. The package allows >=3.10,<3.15.
python-version = "3.12"

# rest, local, cfg, domain, and contract are importable from workflow_engine/
# (the install root). tests/test_connection.py inserts rest/ for a direct import.
search-path = [
  "workflow_engine",
  "workflow_engine/rest",
  ".",
]

# Owned by sibling repositories, or not present in this tree (ops was referenced
# by the package metadata but has no sources here).
ignore-missing-imports = [
  "methyl_domain",
  "methyl_domain.*",
  "methyl_worker",
  "methyl_worker.*",
  "methyl_utils",
  "methyl_utils.*",
  "methyl_enricher",
  "methyl_enricher.*",
  "ops",
  "ops.*",
]
