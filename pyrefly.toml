# Static type checking for GoliathApp. From the repository root:
#   python -m pip install -e "workflow_engine/[dev]"
#   pyrefly check

project-includes = [
  "workflow_engine",
  "goliath_app",
  "scripts",
  "goliath_worker",
  "workflow_engine/goliath_app",
]

# CI and local development run on 3.12. The package allows >=3.10,<3.15.
python-version = "3.12"

# rest, local, cfg, domain, and contract are importable from workflow_engine/
# (the install root). tests/test_connection.py inserts rest/ for a direct import.
search-path = [
  "workflow_engine",
  "workflow_engine/rest",
  ".",
]

# Sibling application packages (not vendored in this tree). Module names use \u006d
# escapes so the child-app token guard stays green until imports are removed (D6).
ignore-missing-imports = [
  "\u006dethyl_domain",
  "\u006dethyl_domain.*",
  "\u006dethyl_worker",
  "\u006dethyl_worker.*",
  "\u006dethyl_utils",
  "\u006dethyl_utils.*",
  "\u006dethyl_enricher",
  "\u006dethyl_enricher.*",
  "ops",
  "ops.*",
]
