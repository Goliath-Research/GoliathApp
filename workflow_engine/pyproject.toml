[project]
name = "goliath-gateway"
version = "1.0.0"
description = "GoliathApp workflow REST gateway (PostgreSQL)"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
  "psycopg[binary,pool]>=3.1",
  "pydantic>=2.6.0,<3.0.0",
  "azure-identity>=1.15.0",
  "PyJWT[crypto]>=2.8",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pyrefly>=1.3.2,<2"]
device_adapters = ["paho-mqtt>=2.1.0", "websocket-client>=1.7.0"]

[project.entry-points."goliath.auth_providers"]
rbac_identity_providers = "goliath_app.auth.providers:default_rbac_identity_provider"

[project.scripts]
goliath-gateway = "rest.gateway:main"
goliath-workflow-run = "local.runner:main"
goliath-cfg = "cfg.cli:main"
goliath-export-action-schemas = "goliath_app.actions.schema_export:main"
goliath-semantic-export = "goliath_app.semantic.export:main"
goliath-mqtt-adapter = "goliath_app.device_adapter.mqtt_adapter:mqtt_main"
goliath-ha-adapter = "goliath_app.device_adapter.ha_adapter:ha_main"

[project.entry-points."goliath.action_catalogs"]
engine = "goliath_app.engine.catalog:ACTION_CATALOG"
core = "goliath_app.core.catalog:ACTION_CATALOG"
inv = "goliath_app.inv.catalog:ACTION_CATALOG"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# goliath_app is the repo-root package, linked at ./goliath_app so the sdist
# and wheel include it. Searching ".." drops those files from the release tree.
[tool.setuptools.packages.find]
where = [".", ".."]
include = ["rest*", "local*", "admin*", "ops*", "cfg*", "domain*", "contract*", "goliath_app*"]

[tool.setuptools.package-dir]
"" = "."
"goliath_app" = "../goliath_app"
