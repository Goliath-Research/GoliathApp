name: Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# GITHUB_TOKEN uploads the Pages artifact and creates the deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Do not cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build the MkDocs site
        run: |
          python -m pip install -U pip -r requirements-docs.txt
          mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
