name: PR

# Runs on every pull_request sync against main.
on:
  pull_request:
    branches:
      - main

jobs:
  pr:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: goliath_ci
          POSTGRES_DB: goliathapp_schema_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mosquitto:
        image: eclipse-mosquitto:2
        ports:
          - 1883:1883
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install contract and test dependencies
        run: python -m pip install -U pip pyyaml pytest httpx

      - name: Validate DB object contract
        run: python workflow_engine/contract/validate_contract.py

      - name: Install the Python gateway
        run: python -m pip install -e "workflow_engine/[dev,device_adapters]"

      - name: Type check with Pyrefly
        run: pyrefly check

      - name: Action schema export check
        run: goliath-export-action-schemas --check schemas/actions/platform_catalog.json

      - name: Semantic catalog export check
        run: |
          goliath-semantic-export --check schemas/semantic/catalog.json \
            --row-types workflow_engine/sql_pg/portal_semantic_row_types.sql

      - name: Fetch Exograph (pinned linux-x86_64)
        run: python3 scripts/fetch_third_party.py

      - name: Build Exograph project
        run: ../third_party/vendor/exograph/0.29.1/linux-x86_64/exo build
        working-directory: exo

      - name: Gateway unit tests
        run: |
          python -m pytest \
            workflow_engine/tests/test_connection.py \
            workflow_engine/tests/test_asgi.py \
            workflow_engine/tests/test_gateway_auth.py \
            workflow_engine/tests/test_cfg_bundle_layout.py \
            workflow_engine/tests/test_pg_plpgsql_variable_conflict.py \
            workflow_engine/tests/test_action_catalog_platform.py \
            workflow_engine/tests/test_local_workflow.py \
            workflow_engine/tests/test_pipeline_scope_flags.py \
            workflow_engine/tests/test_reference_selection.py \
            $(python3 -c "import pathlib; print(next(pathlib.Path('workflow_engine/tests').glob('test_goliathapp_sql_no_*domain.py')))") \
            workflow_engine/tests/test_goliathapp_no_child_app_tokens.py \
            workflow_engine/tests/test_goliathapp_pg_schema_apply.py \
            workflow_engine/tests/test_worker_session_auth.py \
            workflow_engine/tests/test_semantic_layer.py \
            workflow_engine/tests/test_inv_module.py \
            workflow_engine/tests/test_portal_client.py \
            workflow_engine/tests/test_portal_client_types.py \
            workflow_engine/tests/test_exograph_third_party.py \
            workflow_engine/tests/test_worker_wake.py \
            workflow_engine/tests/test_wake_auto_publish.py \
            workflow_engine/tests/test_postgres_wake.py \
            workflow_engine/tests/test_device_adapter_unit.py \
            workflow_engine/tests/test_device_adapter_inheritance_flow.py \
            workflow_engine/tests/test_device_adapter_protocol_integration.py \
            -q
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: goliath_ci
          POSTGRES_DB: goliathapp_schema_test
          GOLIATH_PROTOCOL_TESTS: "1"
          GOLIATH_MQTT_HOST: localhost
          GOLIATH_MQTT_PORT: "1883"

  product-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate .goliath/product.json
        run: |
          python -m pip install -U pip check-jsonschema
          check-jsonschema --schemafile .goliath/product.schema.json .goliath/product.json

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build the MkDocs site
        run: |
          python -m pip install -U pip -r requirements-docs.txt
          mkdocs build --strict

      - name: Validate Mermaid sources (mmdc)
        run: python3 scripts/validate_mermaid_docs.py
